[package]
name = "nagoya"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "An async runtime that does not need an operating system"
repository = "https://github.com/pathscale/nagoya"
readme = "README.md"
keywords = ["async", "runtime", "executor", "no-std", "work-stealing"]
categories = ["asynchronous", "concurrency", "no-std"]

[features]
default = ["std"]
# Off, this crate does not link `std`. What it costs: `Runtime`, which owns
# threads, and the parker `block_on` uses when there is one to park.
std = ["ps-st3/host"]

# Pointed at the local checkout while pathscale/ps-st3#4 is open: the published
# 0.5.0 does not have the submit fix, and the numbers in examples/ were taken
# with it. Drop this line once that lands and 0.5.1 is out, or the benchmarks
# quietly measure the wrong thing.
[patch.crates-io]
ps-st3 = { path = "/Users/revenge/code/ps-st3" }

[dependencies]
ps-st3 = { version = "0.5.0", default-features = false, features = ["fanout"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
# The task itself: one allocation holding the future, its state machine, its
# waker vtable and its output, with `Runnable::into_raw` handing the pointer
# straight to `fanout::Job`. This crate had its own; `async-task` is the same
# design done by people who have been at it for years, it is what `forte` uses,
# and with default features off it links no `std` and pulls in nothing.
async-task = { version = "4.7", default-features = false }

[dev-dependencies]
ps-st3 = { version = "0.5.0", features = ["fanout", "host"] }
# The comparison arm. Only the scheduler is used; nothing here needs its I/O.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The other comparison arm. Not an async runtime: a data-parallel pool, so it
# only appears in the arms that submit a closure rather than a future.
rayon = "1"
# A third comparison arm, and the only one that claims both jobs at once: forte
# advertises itself as a lower-overhead `rayon_core` *and* an async executor.
forte = "1.0.0-beta.1"

[[example]]
name = "vs_tokio"
required-features = ["std"]

[[example]]
name = "submit_only"
required-features = ["std"]

[[example]]
name = "where_the_time_is"
required-features = ["std"]

[[example]]
name = "profile_me"
required-features = ["std"]

[[example]]
name = "profile_tokio"
required-features = ["std"]

[[example]]
name = "wake_latency"
required-features = ["std"]

[[example]]
name = "counter_floor"
required-features = ["std"]

[[example]]
name = "three_pools"
required-features = ["std"]

# Symbols in the optimised build. `sample` against a stripped binary reports
# addresses, and an unreadable profile is not a finding.
[profile.release]
debug = 1
