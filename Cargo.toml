[package]
name = "nagoya"
version = "0.1.12"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "An async runtime that does not need an operating system"
repository = "https://github.com/pathscale/nagoya"
readme = "README.md"
keywords = ["async", "runtime", "executor", "no-std", "work-stealing"]
categories = ["asynchronous", "concurrency", "no-std"]

[features]
default = ["std"]
# Off, this crate does not link `std`. What it costs: `Runtime`, which owns
# threads, and the parker `block_on` uses when there is one to park.
std = ["ps-st3/host", "async-task/std", "dep:futures-io", "futures-io/std", "dep:futures-util", "futures-util/std", "futures-util/io"]
# The I/O driver. Needs an operating system, so it needs `std`, and it is off
# by default for the same reason `runtime` is honest about owning threads: a
# build that does not ask for sockets must not acquire a reactor thread as a
# side effect of depending on this crate.
reactor = ["std", "dep:libc", "dep:bytes"]
# Child processes, as `nagoya::process`. Needs the reactor, which is where the
# pipes and the exit notification register, and `futures-io`, whose `AsyncRead`
# and `AsyncWrite` the pipes implement. Off by default for the same reason the
# reactor is: the first spawn starts a reactor thread, and a build that never
# asked for child processes must not be able to acquire one.
process = ["reactor", "dep:futures-io"]
# Count the reactor's syscalls. Off by default: the counters sit on the hottest
# path in the crate, so they are compiled out rather than branched over.
syscall-counters = ["reactor"]


[dependencies]
ps-st3 = { version = "^0.6", default-features = false, features = ["fanout"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
# The task itself: one allocation holding the future, its state machine, its
# waker vtable and its output, with `Runnable::into_raw` handing the pointer
# straight to `fanout::Job`. This crate had its own; `async-task` is the same
# design done by people who have been at it for years, it is what `forte` uses,
# and with default features off it links no `std` and pulls in nothing.
async-task = { version = "4.7", default-features = false }
# The platform, for the reactor only. A crate wrapping libc is still a crate
# depending on an operating system; what matters is that no `no_std` build
# reaches it, which the optional dependency and the `reactor` feature enforce.
# Same version the house uses in ekostd.
libc = { version = "^0.2.189", default-features = false, optional = true }
# For the reactor's zero-copy receive: reading into a `BytesMut`'s
# uninitialised tail is what keeps a socket from copying every byte it
# receives. `no_std`-capable itself, and gated behind `reactor` regardless.
bytes = { version = "^1", default-features = false, optional = true }
# The file traits `io` builds on. They belong to no runtime and link no `std`
# with their own feature off, which is why the abstraction can exist here at
# all rather than in whatever crate happens to own the storage engine.
futures-io = { version = "0.3", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
ps-st3 = { version = "^0.6", features = ["fanout", "host"] }
# The comparison arm. Only the scheduler is used; nothing here needs its I/O.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
# The other comparison arm. Not an async runtime: a data-parallel pool, so it
# only appears in the arms that submit a closure rather than a future.
rayon = "1"
# The order-book benchmark parses real JSON with the real parser, because the
# thing being measured is how much of a trading path is `serde_json` and a
# decimal string turned into an `f64`. Approximating that would decide the
# answer in advance.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A third comparison arm, and the only one that claims both jobs at once: forte
# advertises itself as a lower-overhead `rayon_core` *and* an async executor.
forte = "1.0.0-beta.1"

[[example]]
name = "vs_tokio"
required-features = ["std"]

[[example]]
name = "submit_only"
required-features = ["std"]

[[example]]
name = "where_the_time_is"
required-features = ["std"]

[[example]]
name = "profile_me"
required-features = ["std"]

[[example]]
name = "profile_tokio"
required-features = ["std"]

[[example]]
name = "wake_latency"
required-features = ["std"]

[[example]]
name = "counter_floor"
required-features = ["std"]

[[test]]
name = "reactor_net"
required-features = ["reactor"]

# The reactor is not a default feature, so a test that names it has to say so.
# Without this, `cargo test` with the feature off still tries to build these
# and fails on the import rather than skipping them, which is how the publish
# job broke: it runs `cargo test --release` with no `--all-features`.
[[test]]
name = "reactor_local"
required-features = ["reactor"]

[[test]]
name = "reactor_driver"
required-features = ["reactor"]

[[test]]
name = "reactor_unix"
required-features = ["reactor"]

# Its own binary because it installs the process clock, which only the first
# `set_clock` in a process can do.
[[test]]
name = "reactor_local_timeout"
required-features = ["reactor"]

# Spawns real programs from /bin and /usr/bin, so it needs the feature and a
# Unix to run on.
[[test]]
name = "process"
required-features = ["process"]

[[example]]
name = "core_detect"
required-features = ["std"]

[[example]]
name = "worker_scaling"
required-features = ["std"]

[[example]]
name = "three_pools"
required-features = ["std"]

# Symbols in the optimised build. `sample` against a stripped binary reports
# addresses, and an unreadable profile is not a finding.
[profile.release]
debug = 1

# The Unix socket comparison. Needs the reactor, and tokio's `net` and
# `io-util`, which is why those are dev-dependency features: the comparison arm
# has to be the thing people actually use.
[[example]]
name = "uds_vs_tokio"
required-features = ["reactor"]

# Why a framed reader costs more than one `recv` per message. Needs the
# counters, which is the whole point of it.
[[example]]
name = "read_shape"
required-features = ["syscall-counters"]

# Which syscall is cheaper, measured before the re-arm rule is changed.
[[example]]
name = "rearm_cost"
required-features = ["reactor"]

# Where a wakeup's non-kernel time goes.
[[example]]
name = "wakeup_cost"
required-features = ["reactor"]

# Concurrency and throughput, against tokio configured the way a tokio user
# tuning for this shape would configure it.
[[example]]
name = "uds_scale"
required-features = ["reactor"]

# The nagoya arm alone, long enough to profile without catching another arm.
[[example]]
name = "nagoya_only"
required-features = ["reactor"]

# Per call syscall costs, because sample counts measure frequency not cost.
[[example]]
name = "syscall_cost"
required-features = ["reactor"]
