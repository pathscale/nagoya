[package]
name = "nagoya"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "An async runtime that does not need an operating system"
repository = "https://github.com/pathscale/nagoya"
readme = "README.md"
keywords = ["async", "runtime", "executor", "no-std", "work-stealing"]
categories = ["asynchronous", "concurrency", "no-std"]
publish = false

[features]
default = ["std"]
# Off, this crate does not link `std`. What it costs: `Runtime`, which owns
# threads, and the parker `block_on` uses when there is one to park.
std = ["ps-st3/host"]

[dependencies]
ps-st3 = { version = "0.5.0", default-features = false, features = ["fanout"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[dev-dependencies]
ps-st3 = { version = "0.5.0", features = ["fanout", "host"] }
